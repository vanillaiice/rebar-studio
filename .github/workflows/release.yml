# Desktop releases: push a tag vX.Y.Z (or vX.Y.Z-beta.N for the beta channel) and each platform builds
# its installers into a draft GitHub release, with the update files electron-updater reads. Publish
# the draft to make the update available. See docs/releasing.md for signing and notarization.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # SignPath downloads the unsigned files from this run's artifacts.
  actions: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and publish to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux --publish always

  # Windows is signed by SignPath (docs/releasing.md) once the SIGNPATH_* variables and secret exist,
  # and built unsigned otherwise. Signing happens outside electron-builder, in two rounds: the app
  # executable before the installers pack it, then the installers. Each round waits for a manual
  # approval in SignPath.
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A certificate of our own (CSC_LINK) would make electron-builder sign everything itself.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      # A full build, not --dir: only a build with installer targets writes resources/app-update.yml,
      # which electron-updater needs. Its installers are thrown away. With signing, the app also
      # learns the publisher, and from then on refuses an update signed by anyone else.
      - name: Package the app
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          args=()
          if [ "$SIGN" = true ]; then args+=(-c.win.signtoolOptions.publisherName="SignPath Foundation"); fi
          npx electron-builder --win nsis portable --x64 --publish never -c.directories.output=release/stage1 "${args[@]}"
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: release/stage1/win-unpacked/Rebar Studio.exe
          if-no-files-found: error
      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed-app
      - name: Put the signed app back
        if: env.SIGN == 'true'
        run: cp "release/signed-app/Rebar Studio.exe" "release/stage1/win-unpacked/Rebar Studio.exe"
      - name: Build the installers around it
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --win nsis portable --x64 --publish never --prepackaged release/stage1/win-unpacked
      - name: Upload the installers for signing
        id: unsigned-installers
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: release/*.exe
          if-no-files-found: error
      - name: Sign the installers
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed-installers
      - name: Put the signed installers back
        if: env.SIGN == 'true'
        run: cp release/signed-installers/*.exe release/
      # The publisher name must match what the app checks updates against (publisherName above).
      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item 'release/stage1/win-unpacked/Rebar Studio.exe') + @(Get-ChildItem release/*.exe)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            $subject = $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid' -or $subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') {
              throw "$($file.Name): $($signature.Status), $subject"
            }
            Write-Output "$($file.Name): $subject"
          }
      - name: Update the block map and update files to the signed installer
        run: node scripts/refresh-update-info.mjs release
      - name: Publish to the draft release
        run: |
          shopt -s nullglob
          args=()
          for file in release/*.exe release/*.blockmap release/*.yml; do
            case "$(basename "$file")" in builder-*) ;; *) args+=(-f "$file") ;; esac
          done
          npx electron-builder publish "${args[@]}" --policy always
